<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pack Sim · Blookbase</title>
  <meta name="description" content="Open Blooket packs for free — visual pack simulator with real drop rates. Fan-made, not affiliated with Blooket." />
  <link rel="icon" type="image/png" href="blookbase.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Titan+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(180deg, #0bc2cf 0%, #349aef 100%);
      color: #3a3a3a;
      font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
    }
    body {
      padding: 24px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-bar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .top-bar h1 {
      font-family: "Titan One", cursive;
      font-size: 32px;
      font-weight: 400;
      color: #fff;
      text-shadow: 2px 2px rgba(0,0,0,0.2);
    }
    .top-bar a {
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 8px 14px;
      border-radius: 10px;
      border: 3px solid rgba(255,255,255,0.35);
      transition: background 0.15s;
    }
    .top-bar a:hover { background: #9a49aa; }
    .sub {
      color: rgba(255,255,255,0.95);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 24px;
      text-align: center;
      max-width: 560px;
    }
    .packs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 980px;
      width: 100%;
    }
    .pack-container {
      width: 210px;
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 4px 4px rgba(0, 0, 0, 0.2);
      background-color: #0bc2cf;
      user-select: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .pack-container:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 6px 8px rgba(0, 0, 0, 0.25);
    }
    .pack-container:active { transform: translateY(0) scale(0.98); }
    .pack-img-container {
      position: relative;
      height: calc(100% - 55px);
      background: radial-gradient(circle, rgb(82, 82, 82) 0%, rgb(26, 26, 26) 100%);
    }
    .pack-shadow {
      position: absolute;
      top: 90%; left: 90%;
      width: 80px; height: 80px;
      opacity: 0.5;
      filter: brightness(0) invert(100%);
      transform: translate(-50%, -50%) rotate(10deg);
      pointer-events: none;
    }
    .pack-img {
      position: absolute;
      top: 50%; left: 50%;
      width: 150px; height: 165px;
      object-fit: contain;
      transform: translate(-50%, -50%) rotate(10deg);
      filter: drop-shadow(2px 2px rgba(0, 0, 0, 0.2));
      pointer-events: none;
    }
    .pack-bottom {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgb(52, 154, 239);
      border-top: 4px solid #ffffff;
      color: #ffffff;
      font-size: 22px;
      font-family: "Titan One", "Comic Sans MS", cursive, sans-serif;
      text-shadow: 2px 2px rgba(0, 0, 0, 0.2);
      padding-bottom: 4px;
    }
    .pack-price-icon {
      width: 22px; height: 22px;
      margin-top: 2px; margin-right: 6px;
    }
    .pack-overlay {
      position: absolute;
      inset: 0;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      pointer-events: none;
    }
    .pack-name-badge {
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 8px;
      white-space: nowrap;
      z-index: 5;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      position: relative;
      background-color: #9a49aa;
      color: #ffffff;
      border: 6px solid rgba(255, 255, 255, 0.2);
      padding: 20px;
      box-shadow: 4px 4px rgba(0, 0, 0, 0.2);
      width: 640px;
      max-width: 100%;
      border-radius: 20px;
    }
    .close-btn {
      position: absolute;
      top: 12px; right: 14px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.2);
      transition: color 0.2s;
      z-index: 20;
      padding: 0;
      line-height: 1;
      font-size: 22px;
    }
    .close-btn:hover { color: #ffffff; }
    .modal-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-direction: row;
    }
    @media (max-width: 620px) {
      .modal-wrapper { flex-direction: column; }
      .modal { width: 100%; }
    }
    .modal-pack-card {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 4px 4px rgba(0, 0, 0, 0.2);
      background-color: #0bc2cf;
      width: 285px;
      flex-shrink: 0;
      user-select: none;
    }
    .modal-pack-img-container {
      display: flex;
      position: relative;
      justify-content: center;
      align-items: center;
      width: 285px;
      height: 285px;
      background: radial-gradient(circle, rgb(82, 82, 82) 0%, rgb(26, 26, 26) 100%);
    }
    .modal-pack-shadow {
      position: absolute;
      top: 85%; left: 85%;
      width: 100px; height: 100px;
      opacity: 0.5;
      filter: brightness(0) invert(100%);
      transform: translate(-50%, -50%) rotate(10deg);
      pointer-events: none;
    }
    .modal-pack-img {
      position: absolute;
      top: 50%; left: 50%;
      width: 170px; height: 187px;
      object-fit: contain;
      transform: translate(-50%, -50%) rotate(10deg);
      filter: drop-shadow(2px 2px rgba(0, 0, 0, 0.2));
      pointer-events: none;
    }
    .modal-pack-overlay {
      position: absolute;
      inset: 0;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      pointer-events: none;
    }
    .drop-rates-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 10px 0;
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }
    .drop-rates-overlay.show { display: flex; }
    .drop-rates-content {
      margin: 12px;
      overflow: auto;
      width: 100%;
      height: 100%;
      color: #fff;
    }
    .drop-rates-content h3 {
      font-size: 24px;
      margin-bottom: 7px;
      font-weight: 400;
      font-family: "Titan One", cursive;
      text-align: center;
    }
    .drop-rates-content ul {
      list-style: none;
      font-weight: 700;
      padding: 0;
      margin: 0;
      text-align: left;
      font-size: 13px;
      line-height: 1.45;
    }
    .modal-form {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      min-height: 285px;
      padding-top: 10px;
      gap: 10px;
      text-align: left;
    }
    .modal-title h2 {
      font-family: "Titan One", cursive;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 5px;
      line-height: 1.1;
    }
    .row-btn {
      border: none;
      border-radius: 10px;
      padding: 4px 8px;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-weight: 700;
      font-family: inherit;
      font-size: 14px;
      transition: background-color 0.2s;
      user-select: none;
      line-height: 1.3;
    }
    .row-btn:hover:not(:disabled) { background-color: rgba(255, 255, 255, 0.35); }
    .row-btn:disabled {
      cursor: not-allowed;
      background-color: rgba(0, 0, 0, 0.15);
      color: #9a49aa;
    }
    .tags { display: flex; gap: 5px; margin-top: 0; }
    .tag {
      display: flex;
      align-items: center;
      border-radius: 10px;
      padding: 3px 8px;
      background-color: rgba(0, 0, 0, 0.2);
      margin: 10px 0;
      height: 30px;
      font-size: 14px;
      font-weight: 700;
      user-select: none;
      width: fit-content;
    }
    .tag img { margin: 0 5px 0 0; }
    .buy-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    .qty-input {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 5px;
      background-color: #9a49aa;
      width: 55px;
      color: #ffffff;
      font-weight: 700;
      font-size: 20px;
      font-family: inherit;
      text-align: left;
      outline: none;
    }
    .qty-input:focus { border-color: rgba(255, 255, 255, 0.5); }
    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: -6px;
      margin-bottom: 12px;
    }
    .buy-btn {
      width: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      position: relative;
      font-family: inherit;
      user-select: none;
    }
    .buy-btn-back {
      position: absolute;
      inset: 0;
      background: #4053b3;
      border-radius: 12px;
      transform: translateY(4px);
    }
    .buy-btn-front {
      position: relative;
      background: #4053b3;
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    .buy-btn:hover .buy-btn-front { transform: translateY(-1px); }
    .buy-btn:active .buy-btn-front { transform: translateY(3px); }
    .buy-price { display: inline-flex; align-items: center; }
    .buy-price img { margin: 0 5px 0 10px; }
    .opening-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgb(29, 4, 34);
      cursor: pointer;
      overflow: hidden;
    }
    .opening-screen.show { display: block; }
    .opening-squares {
      position: fixed;
      width: 1260px; height: 1260px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-wrap: wrap;
      pointer-events: none;
      z-index: 1000;
      background-color: rgb(29, 4, 34);
      transition: background-color 0.4s ease;
    }
    .opening-square {
      width: 180px; height: 180px;
      position: relative;
      transform: scale(0.833);
      flex-shrink: 0;
    }
    .opening-square-inner {
      width: 100%; height: 100%;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
    }
    .opening-square-front {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 20px;
    }
    .opening-square-back {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 20px;
      background-color: rgb(55, 18, 70);
      transition: background-color 0.4s ease;
    }
    .opening-square-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }
    .opening-square-content img {
      width: 72px; height: 72px;
      opacity: 0.45;
      filter: brightness(0) invert(1);
    }
    .opening-square-content .counter-text {
      font-family: "Titan One", cursive;
      font-size: 52px;
      color: rgba(255,255,255,0.35);
      line-height: 1;
      user-select: none;
    }
    .opening-wrapper {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1002;
      cursor: pointer;
    }
    .opening-pack-container {
      position: absolute;
      top: 50%; left: 50%;
      width: 320px; height: 360px;
      transform: translate(-50%, -50%);
      user-select: none;
    }
    .opening-pack-container.dropping {
      animation: dropPack 0.35s ease-out forwards;
    }
    .opening-pack-container.opening .opening-pack-img {
      animation: openPack 0.15s ease 0.25s forwards;
    }
    .opening-pack-container.opening .opening-pack-glow {
      animation: openGlow 0.5s ease forwards;
    }
    .opening-pack-container.opening .opening-pack-top {
      animation: openTop 0.4s steps(8) forwards;
    }
    .opening-pack-top {
      position: absolute;
      bottom: 306.5px; left: 2.5px;
      width: 315px; height: 233px;
      background-image: url("https://ac.blooket.com/dashboard/86784c3d4c38fcd559c92f38fbadd7a160947de2/_next/static/media/packTop.c77c88ec.svg");
      background-size: 2835px 233px;
      background-repeat: no-repeat;
      background-position: 0 0;
      display: none;
    }
    .opening-pack-container.opening .opening-pack-top { display: block; }
    .opening-pack-glow {
      position: absolute;
      top: -20px; left: -30px;
      width: 360px; height: 107px;
      opacity: 0;
      pointer-events: none;
    }
    .opening-pack-img {
      position: absolute;
      bottom: 0; left: 0;
      width: 320px; height: 307px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.45));
    }
    .opening-result {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      width: 400px;
      height: calc(400px * 461 / 450);
      transform: translate(-50%, -50%) scale(0);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 4px rgba(0,0,0,0.15);
      user-select: none;
      text-align: center;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .opening-result.show {
      display: flex;
      animation: growIn 0.25s linear 0.1s forwards;
    }
    .opening-blook-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      object-fit: cover;
    }
    .opening-blook-img-wrap {
      position: absolute;
      bottom: 85px;
      left: calc(50% - 95px);
      z-index: 2;
      width: 190px;
    }
    .opening-blook-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }
    .opening-unlocked-text {
      position: absolute;
      top: 15px; left: 5%;
      z-index: 2;
      width: 90%;
      color: #fff;
      font-family: "Titan One", cursive;
      text-align: center;
    }
    .opening-blook-name {
      width: 100%;
      height: 50px;
      text-shadow: 0 3px 3px rgba(0,0,0,0.2);
      white-space: nowrap;
      font-size: 36px;
      line-height: 50px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opening-rarity {
      font-size: 28px;
      text-shadow: -1.5px -1.5px 0 #3a3a3a, 1.5px -1.5px 0 #3a3a3a, -1.5px 1.5px 0 #3a3a3a, 1.5px 1.5px 0 #3a3a3a;
    }
    .opening-bottom-text {
      position: absolute;
      bottom: 15px; left: 5%;
      z-index: 2;
      width: 90%;
      color: #fff;
      font-size: 28px;
      font-family: "Titan One", cursive;
      text-align: center;
      text-shadow: 0 0 4px rgba(0,0,0,0.4);
    }
    .opening-bottom-shadow {
      position: absolute;
      bottom: 0; left: 0;
      z-index: 2;
      width: 100%;
      height: 50px;
      box-shadow: 0 -9px rgba(0,0,0,0.2) inset;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    .loading-msg {
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      margin-top: 40px;
    }
    .footer-note {
      margin-top: 32px;
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    @keyframes dropPack {
      from { transform: translate(-50%, -80%) scale(0.7); opacity: 0; }
      to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    @keyframes openPack {
      from { transform: none; }
      to   { transform: translateY(8px) rotate(-2deg); }
    }
    @keyframes openGlow {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0.7; }
    }
    @keyframes openTop {
      from { background-position: 0 0; }
      to   { background-position: -2520px 0; }
    }
    @keyframes growIn {
      from { transform: translate(-50%, -50%) scale(0); }
      to   { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Pack Sim</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="/">Home</a>
      <a href="/?view=packsim">Calculator</a>
      <a href="/#market">Packs</a>
    </div>
  </div>
  <p class="sub">Click a pack to open it — free simulator with real drop rates. Fan-made · not affiliated with Blooket.</p>
  <div class="packs-grid" id="packsGrid">
    <div class="loading-msg">Loading packs…</div>
  </div>
  <p class="footer-note">Blookbase · Lag0n · Assets © Blooket</p>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" id="purchaseModal">
      <button type="button" class="close-btn" id="closeModal" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
      <div class="modal-wrapper">
        <div class="modal-pack-card">
          <div class="modal-pack-img-container" id="packImgBox">
            <div class="drop-rates-overlay" id="dropRatesOverlay">
              <div class="drop-rates-content">
                <h3>Drop Rates</h3>
                <ul id="dropRatesList"></ul>
              </div>
            </div>
            <img class="modal-pack-shadow" id="modalShadow" src="" alt="" width="100" height="100" />
            <img class="modal-pack-img" id="packMainImg" src="" alt="" width="170" height="187" />
          </div>
          <div class="modal-pack-overlay"></div>
        </div>
        <form class="modal-form" onsubmit="return false;">
          <div>
            <div class="modal-title">
              <h2 id="modalTitle">Pack</h2>
            </div>
            <button type="button" class="row-btn" id="toggleDropRates">Show Drop Rates</button>
            <div class="tags">
              <span class="tag">
                <img src="https://ac.blooket.com/dashboard/86784c3d4c38fcd559c92f38fbadd7a160947de2/_next/static/media/token.8de4e1b8.svg" alt="Token" width="18" height="19" />
                <span id="modalCost">25</span>
              </span>
            </div>
          </div>
          <div>
            <div class="buy-container">
              Purchase Quantity:
              <input type="number" class="qty-input" id="qtyInput" min="1" max="100" value="1" autocomplete="off" />
            </div>
            <div class="btn-row">
              <button type="button" class="row-btn" id="minus1" disabled>− 1</button>
              <button type="button" class="row-btn" data-add="1">+ 1</button>
              <button type="button" class="row-btn" data-add="5">+ 5</button>
              <button type="button" class="row-btn" data-add="10">+ 10</button>
            </div>
            <div class="btn-row">
              <button type="button" class="row-btn qty-set" data-set="1" disabled>1</button>
              <button type="button" class="row-btn qty-set" data-set="5">5</button>
              <button type="button" class="row-btn qty-set" data-set="10">10</button>
              <button type="button" class="row-btn qty-set" data-set="25">25</button>
              <button type="button" class="row-btn qty-set" data-set="50">50</button>
              <button type="button" class="row-btn qty-set" data-set="100">100</button>
              <button type="button" class="row-btn" id="resetQty" disabled title="Reset">↺</button>
            </div>
            <button type="button" class="buy-btn" id="buyBtn">
              <div class="buy-btn-back"></div>
              <div class="buy-btn-front">
                <span>Open <span id="buyQtyLabel">1</span> for </span>
                <span class="buy-price">
                  <img src="https://ac.blooket.com/dashboard/86784c3d4c38fcd559c92f38fbadd7a160947de2/_next/static/media/token.8de4e1b8.svg" alt="Token" width="24" height="25" />
                  <b id="buyPriceLabel">25</b>
                </span>
              </div>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="opening-screen" id="openingScreen">
    <div class="opening-squares" id="openingSquares"></div>
    <div class="opening-wrapper" id="openingWrapper">
      <div class="opening-pack-container" id="packStage">
        <div class="opening-pack-top" id="packTop"></div>
