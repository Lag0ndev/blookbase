<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blookbase | Loading…</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(165deg,#0bc2cf,#349aef);font-family:Nunito,system-ui,sans-serif;color:#fff}
  .wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px}
  .spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  p{opacity:.9;font-size:15px}
</style>
</head>
<body>
<div class="wrap"><div class="spin"></div><p>Loading Blookbase…</p></div>
<script>
(async function () {
  try {
    var parts = [];
    for (var i = 0; i < 12; i++) {
      var name = 'iparts/p' + String(i).padStart(2, '0') + '.txt';
      var r = await fetch(name, { cache: 'no-cache' });
      if (!r.ok) throw new Error('Failed to load ' + name + ' (' + r.status + ')');
      parts.push(await r.text());
    }
    var html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="wrap"><p>Failed to load site.</p><p style="font-size:13px;opacity:.8">' +
      String(e && e.message || e) + '</p><p><a href="/" style="color:#fff">Retry</a></p></div>';
  }
})();
</script>
</body>
</html>
