<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blookbase | Fake Account Lookup</title>
    <link rel="icon" type="image/png" href="blooketbase.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: rgb(154, 73, 170);
            --accent-dark: rgb(122, 3, 157);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #0bc2cf 0%, #349aef 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
        }
        h1 {
            font-weight: 900;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            margin: 0 0 20px;
            font-size: 1.9rem;
        }
        .back {
            align-self: flex-start;
            margin-bottom: 12px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            opacity: 0.9;
        }
        .back:hover { opacity: 1; text-decoration: underline; }
        .lookup-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border: 2px solid rgba(154,73,170,0.25);
            width: 100%;
            max-width: 720px;
        }
        .lookup-disclaimer {
            background: linear-gradient(135deg, #fff3cd, #ffeeba);
            border: 1px solid #ffc107;
            color: #856404;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .lookup-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .lookup-form input {
            flex: 1;
            min-width: 180px;
            padding: 14px 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            outline: none;
        }
        .lookup-form input:focus { border-color: var(--accent); }
        .lookup-form button {
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .lookup-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(154,73,170,0.4);
        }
        .lookup-result { display: none; animation: fadeIn 0.35s ease; }
        .lookup-result.show { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .lookup-profile {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 2px solid #eee;
        }
        .lookup-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #0bc2cf);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            font-weight: 900;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(154,73,170,0.35);
        }
        .lookup-name { font-size: 1.6rem; font-weight: 900; margin: 0 0 4px; }
        .lookup-sub { font-size: 0.95rem; color: #666; font-weight: 600; }
        .lookup-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }
        .lookup-stat {
            background: linear-gradient(145deg, #f8f4fc, #f0e8f7);
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid rgba(154,73,170,0.15);
        }
        .lookup-stat-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-dark);
            display: block;
        }
        .lookup-stat-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 4px;
        }
        .lookup-section-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0 0 12px;
        }
        .lookup-blooks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .lookup-blook {
            background: white;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            width: 90px;
            transition: transform 0.15s, border-color 0.15s;
        }
        .lookup-blook:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }
        .lookup-blook-icon { font-size: 1.8rem; margin-bottom: 4px; }
        .lookup-blook-name {
            font-size: 0.72rem;
            font-weight: 700;
            color: #444;
            line-height: 1.2;
        }
        .lookup-blook-rarity {
            font-size: 0.65rem;
            font-weight: 800;
            margin-top: 3px;
            text-transform: capitalize;
        }
        .rarity-common { color: #6c757d; }
        .rarity-uncommon { color: #28a745; }
        .rarity-rare { color: #007bff; }
        .rarity-epic { color: #9b59b6; }
        .rarity-legendary { color: #f39c12; }
        .rarity-chroma { color: #e91e63; }
        .rarity-mystical { color: #00bcd4; }
        .lookup-loading {
            text-align: center;
            padding: 30px;
            font-weight: 700;
            color: var(--accent);
            display: none;
        }
        .lookup-loading.show { display: block; }
    </style>
</head>
<body>
    <a class="back" href="/"><i class="fas fa-arrow-left"></i> Back to Blookbase</a>
    <h1>Account Lookup</h1>
    <div class="lookup-card">
        <div class="lookup-disclaimer">
            ⚠️ This is a <b>fake / fun simulator</b> only. All stats are randomly generated and do <b>not</b> reflect any real Blooket accounts.
        </div>
        <div class="lookup-form">
            <input type="text" id="lookup-username" placeholder="Enter any username..." maxlength="24" autocomplete="off">
            <button type="button" onclick="runFakeLookup()">Look Up</button>
        </div>
        <div class="lookup-loading" id="lookup-loading">Searching the void...</div>
        <div class="lookup-result" id="lookup-result">
            <div class="lookup-profile">
                <div class="lookup-avatar" id="lookup-avatar">?</div>
                <div>
                    <h2 class="lookup-name" id="lookup-name">Username</h2>
                    <div class="lookup-sub" id="lookup-sub">Joined • Level</div>
                </div>
            </div>
            <div class="lookup-stats" id="lookup-stats"></div>
            <h3 class="lookup-section-title">Top Blooks Owned</h3>
            <div class="lookup-blooks" id="lookup-blooks"></div>
        </div>
    </div>

    <script>
    (function() {
        const FAKE_BLOOKS = [
            {name:"Rainbow Astronaut", rarity:"chroma", icon:"🚀"},
            {name:"Spooky Ghost", rarity:"legendary", icon:"👻"},
            {name:"Golden Dragon", rarity:"legendary", icon:"🐉"},
            {name:"Cyber Bunny", rarity:"epic", icon:"🐰"},
            {name:"Mystic Fox", rarity:"mystical", icon:"🦊"},
            {name:"Neon Cat", rarity:"chroma", icon:"🐱"},
            {name:"Ice King", rarity:"legendary", icon:"❄️"},
            {name:"Pixel Knight", rarity:"epic", icon:"⚔️"},
            {name:"Shadow Wolf", rarity:"rare", icon:"🐺"},
            {name:"Lucky Clover", rarity:"uncommon", icon:"🍀"},
            {name:"Fire Phoenix", rarity:"legendary", icon:"🔥"},
            {name:"Ocean Whale", rarity:"epic", icon:"🐋"},
            {name:"Cosmic Owl", rarity:"chroma", icon:"🦉"},
            {name:"Toxic Slime", rarity:"rare", icon:"🟢"},
            {name:"Royal Crown", rarity:"legendary", icon:"👑"},
            {name:"Happy Blob", rarity:"common", icon:"🟡"},
            {name:"Storm Cloud", rarity:"uncommon", icon:"⛈️"},
            {name:"Crystal Unicorn", rarity:"mystical", icon:"🦄"},
            {name:"Retro Robot", rarity:"epic", icon:"🤖"},
            {name:"Vampire Bat", rarity:"rare", icon:"🦇"}
        ];

        function seededRandom(seed) {
            let h = 0;
            for (let i = 0; i < seed.length; i++) {
                h = Math.imul(31, h) + seed.charCodeAt(i) | 0;
            }
            return function() {
                h = Math.imul(h ^ (h >>> 16), 2246822507);
                h = Math.imul(h ^ (h >>> 13), 3266489909);
                h ^= h >>> 16;
                return (h >>> 0) / 4294967296;
            };
        }

        function pick(arr, rand, count) {
            const copy = arr.slice();
            const out = [];
            for (let i = 0; i < count && copy.length; i++) {
                const idx = Math.floor(rand() * copy.length);
                out.push(copy.splice(idx, 1)[0]);
            }
            return out;
        }

        window.runFakeLookup = function() {
            const input = document.getElementById('lookup-username');
            const username = (input.value || '').trim() || 'Player' + Math.floor(Math.random()*9000+1000);
            const result = document.getElementById('lookup-result');
            const loading = document.getElementById('lookup-loading');

            result.classList.remove('show');
            loading.classList.add('show');

            setTimeout(function() {
                const rand = seededRandom(username.toLowerCase());

                const tokens = Math.floor(rand() * 48000) + 120;
                const coins = Math.floor(rand() * 2500000) + 500;
                const xp = Math.floor(rand() * 850000) + 1000;
                const level = Math.min(100, Math.floor(xp / 8500) + 1);
                const blooksOwned = Math.floor(rand() * 180) + 12;
                const boxesOpened = Math.floor(rand() * 900) + 20;
                const gamesPlayed = Math.floor(rand() * 3400) + 50;
                const winRate = (45 + rand() * 40).toFixed(1);
                const joinYear = 2020 + Math.floor(rand() * 6);
                const joinMonth = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Math.floor(rand()*12)];

                document.getElementById('lookup-avatar').textContent = username.charAt(0).toUpperCase();
                document.getElementById('lookup-name').textContent = username;
                document.getElementById('lookup-sub').textContent = 'Joined ' + joinMonth + ' ' + joinYear + '  •  Level ' + level;

                document.getElementById('lookup-stats').innerHTML =
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + tokens.toLocaleString() + '</span><span class="lookup-stat-label">Tokens</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + coins.toLocaleString() + '</span><span class="lookup-stat-label">Coins</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + xp.toLocaleString() + '</span><span class="lookup-stat-label">XP</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + blooksOwned + '</span><span class="lookup-stat-label">Blooks</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + boxesOpened + '</span><span class="lookup-stat-label">Boxes Opened</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + gamesPlayed + '</span><span class="lookup-stat-label">Games Played</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + winRate + '%</span><span class="lookup-stat-label">Win Rate</span></div>' +
                    '<div class="lookup-stat"><span class="lookup-stat-value">' + level + '</span><span class="lookup-stat-label">Level</span></div>';

                const numBlooks = 6 + Math.floor(rand() * 5);
                const chosen = pick(FAKE_BLOOKS, rand, numBlooks);
                document.getElementById('lookup-blooks').innerHTML = chosen.map(function(b) {
                    return '<div class="lookup-blook">' +
                        '<div class="lookup-blook-icon">' + b.icon + '</div>' +
                        '<div class="lookup-blook-name">' + b.name + '</div>' +
                        '<div class="lookup-blook-rarity rarity-' + b.rarity + '">' + b.rarity + '</div>' +
                    '</div>';
                }).join('');

                loading.classList.remove('show');
                result.classList.add('show');
            }, 600 + Math.random() * 500);
        };

        document.getElementById('lookup-username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runFakeLookup();
        });
    })();
    </script>
</body>
</html>
