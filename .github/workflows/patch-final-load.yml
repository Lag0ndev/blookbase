name: Final Load Fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_final_load.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_final_load.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html vercel.json
          git commit -m "fix: final load-proof index (visible without CDN)" || echo nochange
          git push
