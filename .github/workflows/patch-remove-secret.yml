name: Remove Secret + fix Blooks sidebar
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_remove_secret_fix_blooks.py'
      - '.github/workflows/patch-remove-secret.yml'
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_remove_secret_fix_blooks.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then echo No change; else
            git commit -m "chore: fully remove Secret; Blooks suitcase icon + routing"
            git push
          fi
