name: Blooket Tracker

# Schedule DISABLED — was redeploying constantly and breaking the live site.
# Run manually from Actions tab when you want a data refresh.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe assets + weekly shop
        run: python3 scripts/probe_weekly_shop.py
      - name: Commit data only (never index.html)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-check.json data/weekly-shop.json data/updates.json || true
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "chore: blooket asset + weekly shop check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
