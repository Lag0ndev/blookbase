name: Blooket Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe assets + weekly shop
        run: python3 scripts/probe_weekly_shop.py
      - name: Commit data only (never rewrite index.html)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Do NOT add index.html — rewriting it every 5 min forces Vercel redeploys
          # and can make the live site feel like it auto-refreshes / breaks interactions.
          git add data/last-check.json data/weekly-shop.json data/updates.json || true
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "chore: blooket asset + weekly shop check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
