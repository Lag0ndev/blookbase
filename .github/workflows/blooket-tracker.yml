name: Blooket Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data
          sparse-checkout-cone-mode: false

      - name: Probe
        run: |
          # Parallel HEAD requests (fastest)
          curl -s -o /dev/null -w '%{http_code} purpleastronaut\n' --max-time 3 -I https://ac.blooket.com/marketassets/blooks/purpleastronaut.svg &
          curl -s -o /dev/null -w '%{http_code} lemoncrab\n' --max-time 3 -I https://ac.blooket.com/marketassets/blooks/lemoncrab.svg &
          curl -s -o /dev/null -w '%{http_code} clawmania\n' --max-time 3 -I https://ac.blooket.com/marketassets/blooks/clawmania.svg &
          curl -s -o /dev/null -w '%{http_code} fishtank\n' --max-time 3 -I https://ac.blooket.com/marketassets/blooks/fishtank.svg &
          wait
          printf '{"checkedAt":"%s","status":"ok"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/last-check.json

      - name: Save
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add data/last-check.json
          git diff --staged --quiet || (git commit -m "chore: check" && git push)
