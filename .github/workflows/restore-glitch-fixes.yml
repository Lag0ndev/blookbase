name: Restore glitch fix scripts
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore_blooks.py'
      - 'scripts/restore_settings.py'
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_blooks.py && python3 scripts/restore_settings.py && python3 scripts/patch_glitches.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bb-blooks.js bb-settings-enhance.js index.html
          if git diff --staged --quiet; then echo No change; else
            git commit -m "fix: restore blooks UI + settings glitch fixes"
            git push
          fi
