name: Patch Whats New Spooky
on: workflow_dispatch
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_whatsnew_spooky.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: What's New Spooky LIVE + Contest of Candy + Lag0n video; Season 8 past" || echo nochange
          git push
