name: Patch Secret into index.html

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_secret.py'
      - '.github/workflows/patch-secret.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python3 scripts/patch_secret.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "feat: Secret !!! page in index.html (routes, sidebar, daily tokens)"
            git push
          fi
