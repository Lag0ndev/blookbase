name: Countdown estimated disclaimer
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_countdown_disclaimer.py'
jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_countdown_disclaimer.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then echo No change; else
            git commit -m "content: countdown dates are estimated, not confirmed"
            git push
          fi
