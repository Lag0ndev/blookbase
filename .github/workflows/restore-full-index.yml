name: Restore full index.html

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-full-index.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore classic index from e26e372f
        run: |
          git show e26e372f:index.html > index.html
          python3 << 'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          assert len(t) > 100000, 'index too small'
          assert 'PLACEHOLDER' not in t[:50]
          # ensure enhancer scripts at end
          if 'bb-nav-fix.js' not in t:
              t = t.replace(
                  '</body>',
                  '<script src="bb-blooks.js" defer></script>\n<script src="bb-nav-fix.js" defer></script>\n</body>',
                  1,
              )
          # remove tracker rewrite if present in vercel - handled separately
          p.write_text(t, encoding='utf-8')
          print('restored size', p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "restore: full classic Blookbase index.html (working build)"
            git push
          fi
