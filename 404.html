<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Blookbase</title>
  <link rel="icon" type="image/png" href="/blookbase.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      font-family: Nunito, system-ui, sans-serif;
      background: linear-gradient(180deg, #0bc2cf 0%, #349aef 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-family: "Titan One", cursive;
      font-size: clamp(64px, 18vw, 120px);
      font-weight: 400;
      text-shadow: 4px 4px rgba(0,0,0,0.2);
      line-height: 1;
      margin-bottom: 8px;
    }
    h2 {
      font-family: "Titan One", cursive;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 12px;
      text-shadow: 2px 2px rgba(0,0,0,0.15);
    }
    p {
      font-weight: 700;
      font-size: 16px;
      opacity: 0.95;
      max-width: 420px;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #9a49aa;
      color: #fff;
      font-weight: 900;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 14px;
      border: 4px solid rgba(255,255,255,0.25);
      box-shadow: 4px 4px rgba(0,0,0,0.2);
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover { background: #7a039d; transform: translateY(-2px); }
    .links { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .links a {
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 8px 14px;
      border-radius: 10px;
      border: 3px solid rgba(255,255,255,0.35);
    }
    .links a:hover { background: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>This page doesn’t exist on Blookbase. Double-check the URL or head back home.</p>
  <a class="btn" href="/">← Back to Home</a>
  <div class="links">
    <a href="/packsim">Pack Sim</a>
    <a href="/calculator">Calculator</a>
    <a href="/market">Packs</a>
    <a href="/countdown">Countdown</a>
  </div>
</body>
</html>
